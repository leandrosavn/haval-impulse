name: Build and Release APK

on:
  push:
    branches: [master, preview]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get latest version and increment
        id: version
        run: |
          git fetch --tags --force

          BRANCH_NAME="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"

          # Esquema de versão PRÓPRIO do fork (semver 2.x), desassociado do
          # upstream (que usa 1.0.0.<build>). workflow_dispatch: usa o input
          # (ex.: "2.1.0" p/ subir minor/major); senão auto-incrementa o PATCH
          # da maior tag v2 existente.
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_SEMVER="${{ github.event.inputs.version }}"
          else
            LATEST=$(git tag --list "v2.*" --sort=-v:refname | grep -vi -- '-preview' | head -n1)
            if [ -z "$LATEST" ]; then
              NEW_SEMVER="2.0.0"
            else
              MAJOR_MINOR=$(echo "$LATEST" | grep -oP 'v\K\d+\.\d+')
              PATCH=$(echo "$LATEST" | grep -oP 'v\d+\.\d+\.\K\d+')
              NEW_SEMVER="${MAJOR_MINOR}.$((PATCH + 1))"
            fi
          fi

          if [ "$BRANCH_NAME" = "preview" ]; then
            NEW_VERSION="${NEW_SEMVER}-preview"
          else
            NEW_VERSION="$NEW_SEMVER"
          fi
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # versionCode monotônico derivado do semver: MAJOR*10000 + MINOR*100 + PATCH
          # (2.0.0 -> 20000, bem acima do último esquema antigo = 76). Manter patch < 100.
          MA=$(echo "$NEW_SEMVER" | cut -d. -f1)
          MI=$(echo "$NEW_SEMVER" | cut -d. -f2)
          PA=$(echo "$NEW_SEMVER" | cut -d. -f3)
          NEW_VERSION_CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "new_version_code=$NEW_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Update build.gradle.kts
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.new_version }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.new_version_code }}/" app/build.gradle.kts

      - name: Build with Gradle
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create Release
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-${GITHUB_REF##*/}}"
          EXTRA_FLAGS=""
          if [ "$BRANCH_NAME" = "preview" ]; then
            EXTRA_FLAGS="--prerelease"
          fi

          gh release create v${{ steps.version.outputs.new_version }} \
            --title "Release ${{ steps.version.outputs.new_version }}" \
            --notes "Automated release" \
            $EXTRA_FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to release
        run: |
          gh release upload v${{ steps.version.outputs.new_version }} app/build/outputs/apk/release/app-release.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
